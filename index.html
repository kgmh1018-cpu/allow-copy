<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allow-Copy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bookmark-bar" id="bookmarkBar">
    <div class="bm-item">
      <div class="bm-favicon" style="background:#4285f4;"></div>
      <span class="bm-label">Gmail</span>
    </div>
    <div class="bm-item">
      <div class="bm-favicon" style="background:#24292e; border-radius:50%;"></div>
      <span class="bm-label">GitHub</span>
    </div>
    <div class="bm-sep"></div>
    <div class="bm-slot" id="bmSlot">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Allow-Copy
    </div>
    <div class="bm-sep"></div>
    <div class="bm-item">
      <div class="bm-favicon" style="background:#ff4e00; border-radius:50%;"></div>
      <span class="bm-label">Notion</span>
    </div>
    <div class="bm-item">
      <div class="bm-favicon" style="background:#1877f2; border-radius:2px;"></div>
      <span class="bm-label">YouTube</span>
    </div>
  </div>

  <div class="fake-cursor" id="fakeCursor">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3.5 2L17 10.5L10 11.8L7 18.5L3.5 2Z" fill="#1d1d1f" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="page">
    <div class="card">
      <span class="eyebrow">Bookmarklet</span>
      <h1 class="card-title">Allow-Copy</h1>
      <p class="card-desc">복사 차단이 걸린 페이지에서<br>텍스트를 자유롭게 선택하세요.</p>

      <div class="btn-wrap">
        <a id="bookmarklet-link" href="#" class="drag-btn" draggable="true" title="Allow-Copy" data-drag-label="북마크바에 드래그">
          <span class="grip-icon">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
              <circle cx="5.5" cy="4.5" r="1.25"/>
              <circle cx="10.5" cy="4.5" r="1.25"/>
              <circle cx="5.5" cy="8" r="1.25"/>
              <circle cx="10.5" cy="8" r="1.25"/>
              <circle cx="5.5" cy="11.5" r="1.25"/>
              <circle cx="10.5" cy="11.5" r="1.25"/>
            </svg>
          </span>
          <span class="bm-name">Allow-Copy</span>
        </a>
      </div>

      <button class="install-link" id="installBtn">설치 안내</button>
      <span class="version">v1.0 · 2026.05.12</span>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <span class="modal-title">설치 안내</span>
        <button class="close-btn" id="closeBtn">✕</button>
      </div>
      <div class="modal-body">
        <div class="step-row">
          <div class="step-num">1</div>
          <p class="step-text">북마크바가 안 보이면 <kbd>Ctrl+Shift+B</kbd>로 켜세요.</p>
        </div>
        <div class="step-row">
          <div class="step-num">2</div>
          <p class="step-text">아래 버튼을 북마크바로 드래그하세요.</p>
        </div>

        <a id="bookmarklet-link-modal" href="#" class="modal-drag-btn" draggable="true" title="Allow-Copy" data-drag-label="북마크바에 드래그">
          <span class="grip-icon" style="opacity:.5;">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <circle cx="5.5" cy="4.5" r="1.25"/><circle cx="10.5" cy="4.5" r="1.25"/>
              <circle cx="5.5" cy="8" r="1.25"/><circle cx="10.5" cy="8" r="1.25"/>
              <circle cx="5.5" cy="11.5" r="1.25"/><circle cx="10.5" cy="11.5" r="1.25"/>
            </svg>
          </span>
          <span class="bm-name">Allow-Copy</span>
        </a>

        <div class="accordion" id="accordion">
          <button class="acc-trigger" id="accTrigger">
            <div class="acc-left">
              <div class="acc-dot"></div>
              <span class="acc-label">직접 추가하기</span>
            </div>
            <span class="acc-chevron">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>
          </button>
          <div class="acc-body" id="accBody">
            <div class="acc-inner">
              <p class="acc-desc">새 북마크를 만들고 URL 칸에 아래 코드를 붙여넣으세요.</p>
              <button class="copy-btn" id="copyBtn">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <rect x="9" y="9" width="13" height="13" rx="2"/>
                  <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                </svg>
                코드 복사
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="main.js" defer></script>
</body>
</html>
